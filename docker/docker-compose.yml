services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: msoy
      POSTGRES_USER: msoy
      POSTGRES_PASSWORD: msoy
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    expose:
      - "5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data

  mail:
    image: boky/postfix
    container_name: postfix
    environment:
      HOSTNAME: mail.whirled.social
      POSTFIX_mynetworks: 127.0.0.0/8,172.16.0.0/12
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      ALLOWED_SENDER_DOMAINS: "whirled.social"
    ports:
      - "25:25"
    volumes:
      - ./dkim:/etc/opendkim/keys
    restart: unless-stopped

  whirled:
    hostname: ${DOCKER_HOSTNAME}
    build: .
    ports:
      - "9475:8080"
      - "843:843"
      - "4010:4010"
      - "47623:47623"
      - "47624:47624"
      - "47625:47625"
    volumes:
      - ./msoy-media:/export/msoy/pages/media/
    depends_on:
      - db
      - mail
    command: ["/start.sh"]

volumes:
  db_data:
  msoy-media:
  dkim: